openapi: 3.1.0
info:
  title: OpenBoard API
  version: 0.1.0
  description: |
    Authoritative contract of the OpenBoard HTTP API (see api.md).
    Domain resources live under /api/v1. Operational probes live at the root
    because they are not domain resources.

    Authentication uses a server-side session (ADR 0006) carried by the
    `__Host-openboard_session` cookie, set by `POST /api/v1/sessions`.
    Requests with a body must be sent as `application/json`, and cross-origin
    browser requests that change state are rejected with 403.

    While a User has a pending Temporary Password, every authenticated
    endpoint other than `GET /api/v1/users/me`, `PUT /api/v1/users/me/password`
    and `DELETE /api/v1/sessions/current` answers 403 with the
    `password-change-required` problem type.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: operations
    description: Liveness and readiness probes.
  - name: sessions
    description: Signing in and out.
  - name: users
    description: The signed-in User.
  - name: organizations
    description: Organizations, the tenants of the Instance (ADR 0003).
  - name: workspaces
    description: Workspaces, the divisions inside one Organization.
paths:
  /healthz:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Reports whether every dependency required to serve traffic is reachable.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: A dependency is not ready. The failing dependency is logged, not exposed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/service-unavailable
                title: Service unavailable
                status: 503
                instance: /readyz
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Sign in
      description: |
        Checks a Username and password and starts a session, returned in the
        session cookie. Every credential failure gives the same 401, so the
        response never reveals whether a Username exists. After repeated
        failures the Username is blocked for a few minutes (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
              example: __Host-openboard_session=abc123; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
            Location:
              description: The created session.
              schema:
                type: string
              example: /api/v1/sessions/current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          description: Invalid Username or password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/invalid-credentials
                title: Invalid username or password
                status: 401
                instance: /api/v1/sessions
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed sign-ins for this Username. Try again later.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
              example: 300
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/too-many-attempts
                title: Too many failed sign-in attempts
                status: 429
                instance: /api/v1/sessions
  /api/v1/sessions/current:
    delete:
      tags: [sessions]
      operationId: deleteCurrentSession
      summary: Sign out
      description: |
        Ends the session behind the cookie and clears it. Succeeds even when
        the session is already gone.
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Get the signed-in User
      description: Available while a Temporary Password is pending, so clients can ask for a new one.
      responses:
        "200":
          description: The signed-in User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/users/me/password:
    put:
      tags: [users]
      operationId: replaceCurrentUserPassword
      summary: Change the signed-in User's password
      description: |
        Replaces the password, clears a pending Temporary Password and ends
        every other session of the User. The new password must have 12 to 128
        characters and differ from the current password and from the Username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed. The current session stays signed in.
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The current password is wrong or the new one breaks the password rules.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/validation-error
                title: Validation failed
                status: 422
                instance: /api/v1/users/me/password
                errors:
                  - field: new_password
                    code: weak
                    message: use at least 12 characters
  /api/v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List Organizations
      description: |
        Lists the Organizations the signed-in User can see, ordered by name
        ignoring case: every Organization for an Administrator (ADR 0009),
        otherwise those the User holds an Organization Membership in.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of Organizations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/InvalidPage"
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an Organization
      description: |
        Creates an Organization with its Default Workspace, an Open Workspace
        named "Default", and gives its first Organization Owner an
        Organization Membership. The Owner is the creator unless
        `owner_user_id` names another User. Only Administrators can create
        Organizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          headers:
            Location:
              description: The created Organization.
              schema:
                type: string
              example: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User is not an Administrator (`forbidden`), has a
            pending Temporary Password (`password-change-required`), or the
            request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/forbidden
                title: Not allowed
                status: 403
                instance: /api/v1/organizations
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The name is blank or too long (`name`/`invalid`), or `owner_user_id`
            is not a UUID (`invalid`) or not a User (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/validation-error
                title: Validation failed
                status: 422
                instance: /api/v1/organizations
                errors:
                  - field: owner_user_id
                    code: not_found
                    message: user not found
  /api/v1/organizations/{organization_id}:
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: Get an Organization
      description: |
        Returns an Organization the signed-in User can see. Organizations that
        do not exist and those the User cannot see both answer 404, so the
        response never reveals another tenant's Organizations (ADR 0003).
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "404":
          description: No such Organization, or the User cannot see it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/not-found
                title: Resource not found
                status: 404
                instance: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/organizations/{organization_id}/memberships:
    get:
      tags: [organizations]
      operationId: listOrganizationMemberships
      summary: List the Organization Memberships of an Organization
      description: |
        Lists the Organization Memberships of an Organization, ordered by name
        ignoring case and then by Username. Only Organization Owners and
        Administrators can list them. Organizations that do not exist and those
        the User cannot see both answer 404 (ADR 0003).
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of Organization Memberships.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrganizationMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Organization (`forbidden`) or
            has a pending Temporary Password (`password-change-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Organization, or the User cannot see it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/InvalidPage"
    post:
      tags: [organizations]
      operationId: addOrganizationMembership
      summary: Grant an Organization Membership
      description: |
        Adds a User to an Organization. Only Organization Owners and
        Administrators can grant Organization Memberships. An existing User
        matching the Username is linked as is; an unknown Username creates a
        new User with a Temporary Password returned once in the response.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrganizationMembershipRequest"
      responses:
        "201":
          description: Organization Membership granted.
          headers:
            Location:
              description: The created Organization Membership.
              schema:
                type: string
              example: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c/memberships/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedOrganizationMembership"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Organization (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Organization, or the User cannot see it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: The User already holds an Organization Membership in this Organization.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/organization-membership-exists
                title: User already belongs to this Organization
                status: 409
                instance: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c/memberships
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The Username is outside the allowed format (`username`/`invalid`),
            the name is blank or too long (`name`/`invalid`), or the role is
            not `owner` or `contributor` (`role`/`invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/organizations/{organization_id}/memberships/{user_id}:
    patch:
      tags: [organizations]
      operationId: updateOrganizationMembership
      summary: Change the role of an Organization Membership
      description: |
        Changes a User's role in an Organization between `owner` and
        `contributor`. Only Organization Owners and Administrators can change
        roles. The last Organization Owner of an Organization cannot be demoted.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMembershipRequest"
      responses:
        "200":
          description: The Organization Membership after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembership"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Organization (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Organization, the User cannot see it, or no such Organization Membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Demoting this User would leave the Organization without an Organization Owner.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/last-organization-owner
                title: An Organization must keep at least one Organization Owner
                status: 409
                instance: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c/memberships/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The role is missing or not `owner` or `contributor` (`role`/`invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [organizations]
      operationId: removeOrganizationMembership
      summary: Remove an Organization Membership
      description: |
        Removes a User from an Organization and removes every Workspace
        Membership they hold in that Organization. Organization Owners and
        Administrators can remove anyone; Organization Contributors can only
        remove themselves. The last Organization Owner can neither leave nor be
        removed.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Organization Membership removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            An Organization Contributor tried to remove another User (`forbidden`),
            the User has a pending Temporary Password (`password-change-required`),
            or the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Organization, the User cannot see it, or no such Organization Membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Removing this User would leave the Organization without an Organization Owner.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/last-organization-owner
                title: An Organization must keep at least one Organization Owner
                status: 409
                instance: /api/v1/organizations/0b5e3c1a-9f2d-4e6b-8a7c-1d2e3f4a5b6c/memberships/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: List the Workspaces of an Organization
      description: |
        Lists the Workspaces the signed-in User can enter in one Organization,
        ordered by name ignoring case. Administrators and Organization Owners
        see all of them. Other Users see Open Workspaces and those they hold a
        Workspace Membership in.
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of Workspaces.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          description: |
            `page` or `page_size` is out of range, or `organization_id` is not
            a UUID (`invalid`) or names no Organization the User can see
            (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a Workspace
      description: |
        Creates a Workspace in an Organization. Only Organization Owners and
        Administrators can create Workspaces. A creator who holds an
        Organization Membership receives a Workspace Membership as Workspace
        Owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created.
          headers:
            Location:
              description: The created Workspace.
              schema:
                type: string
              example: /api/v1/workspaces/7c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Organization (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: The Organization already has a Workspace with this name, ignoring case.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/workspace-name-taken
                title: Workspace name already in use
                status: 409
                instance: /api/v1/workspaces
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The name is blank or too long (`name`/`invalid`), the visibility is
            unknown (`visibility`/`invalid`), or `organization_id` is not a
            UUID (`invalid`) or names no Organization the User can see
            (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Get a Workspace
      description: |
        Returns a Workspace the signed-in User can enter. Workspaces that do
        not exist and those the User cannot enter both answer 404.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "404":
          description: No such Workspace, or the User cannot enter it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename a Workspace or change its visibility
      description: |
        Changes the fields sent and keeps the others, the Default Workspace
        included. Only those acting as Workspace Owner can change a Workspace:
        its Workspace Owners, Organization Owners and Administrators.
        Workspaces that do not exist and those the User cannot enter both
        answer 404.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: The Workspace after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Workspace (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Workspace, or the User cannot enter it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Another Workspace of the Organization already uses this name, ignoring case.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/workspace-name-taken
                title: Workspace name already in use
                status: 409
                instance: /api/v1/workspaces/7c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The name is blank or too long (`name`/`invalid`), or the
            visibility is not `open` or `restricted` (`visibility`/`invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspace_id}/memberships:
    get:
      tags: [workspaces]
      operationId: listWorkspaceMemberships
      summary: List the Workspace Memberships of a Workspace
      description: |
        Lists the Workspace Memberships of a Workspace, ordered by name
        ignoring case and then by Username. Only those acting as Workspace
        Owner can list them: its Workspace Owners, Organization Owners and
        Administrators. Workspaces that do not exist and those the User cannot
        enter both answer 404.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of Workspace Memberships.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/WorkspaceMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Workspace (`forbidden`) or
            has a pending Temporary Password (`password-change-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Workspace, or the User cannot enter it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/InvalidPage"
    post:
      tags: [workspaces]
      operationId: addWorkspaceMembership
      summary: Grant a Workspace Membership
      description: |
        Adds a User who already holds an Organization Membership in the
        Workspace's Organization to the Workspace. Only those acting as
        Workspace Owner can grant Workspace Memberships. Never creates a new
        User.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMembershipRequest"
      responses:
        "201":
          description: Workspace Membership granted.
          headers:
            Location:
              description: The created Workspace Membership.
              schema:
                type: string
              example: /api/v1/workspaces/7c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f/memberships/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembership"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Workspace (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Workspace, or the User cannot enter it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: The User already holds a Workspace Membership in this Workspace.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://openboard.dev/problems/workspace-membership-exists
                title: User already belongs to this Workspace
                status: 409
                instance: /api/v1/workspaces/7c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f/memberships
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The Username is outside the allowed format (`username`/`invalid`),
            names no User in the Workspace's Organization (`username`/`not_found`),
            or the role is not `owner`, `contributor` or `viewer` (`role`/`invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workspaces/{workspace_id}/memberships/{user_id}:
    patch:
      tags: [workspaces]
      operationId: updateWorkspaceMembership
      summary: Change the role of a Workspace Membership
      description: |
        Changes a User's role in a Workspace between `owner`, `contributor` and
        `viewer`. Only those acting as Workspace Owner can change roles.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceMembershipRequest"
      responses:
        "200":
          description: The Workspace Membership after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembership"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The signed-in User does not manage the Workspace (`forbidden`),
            has a pending Temporary Password (`password-change-required`), or
            the request is cross-origin (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Workspace, the User cannot enter it, or no such Workspace Membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The role is missing or not `owner`, `contributor` or `viewer` (`role`/`invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMembership
      summary: Remove a Workspace Membership
      description: |
        Removes a User's Workspace Membership. Those acting as Workspace Owner
        can remove anyone; other Users can only remove themselves.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Workspace Membership removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            A User who does not manage the Workspace tried to remove another
            User (`forbidden`), the User has a pending Temporary Password
            (`password-change-required`), or the request is cross-origin
            (`cross-origin-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such Workspace, the User cannot enter it, or no such Workspace Membership.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-openboard_session
      description: Opaque session token set by `POST /api/v1/sessions`.
  schemas:
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank.
          example: Acme
        owner_user_id:
          type: string
          format: uuid
          description: The User who becomes the first Organization Owner. Defaults to the creator.
    Organization:
      type: object
      required: [id, name, created_at, current_user_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme
        created_at:
          type: string
          format: date-time
        current_user_role:
          type: string
          enum: [owner, contributor]
          description: The role the signed-in User acts with. Administrators act as `owner` (ADR 0009).
    AddOrganizationMembershipRequest:
      type: object
      required: [username, name]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          description: Normalized to lowercase. Links an existing User as is or creates a new one.
          example: ana.silva
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed display name used when creating a new User.
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor]
          default: contributor
    UpdateOrganizationMembershipRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, contributor]
    OrganizationMembership:
      type: object
      required: [organization_id, user_id, username, name, role, created_at]
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: ana.silva
        name:
          type: string
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor]
        created_at:
          type: string
          format: date-time
    AddedOrganizationMembership:
      allOf:
        - $ref: "#/components/schemas/OrganizationMembership"
        - type: object
          properties:
            temporary_password:
              type: string
              description: Present once when an unknown Username created a new User.
    CreateWorkspaceRequest:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank and must be unique in the Organization, ignoring case.
          example: Legal
        visibility:
          type: string
          enum: [open, restricted]
          default: restricted
    UpdateWorkspaceRequest:
      type: object
      description: Fields left out keep their value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank and must be unique in the Organization, ignoring case.
          example: Legal team
        visibility:
          type: string
          enum: [open, restricted]
    Workspace:
      type: object
      required: [id, organization_id, name, visibility, created_at, updated_at, current_user_role]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          example: Legal
        visibility:
          type: string
          enum: [open, restricted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_user_role:
          type: string
          enum: [owner, contributor, viewer]
          description: |
            The Workspace role the signed-in User acts with. Administrators and
            Organization Owners act as `owner`; without a Workspace Membership,
            an Open Workspace gives `contributor`.
    AddWorkspaceMembershipRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          description: Normalized to lowercase. Must belong to the Workspace's Organization.
          example: ana.silva
        role:
          type: string
          enum: [owner, contributor, viewer]
          default: contributor
    UpdateWorkspaceMembershipRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, contributor, viewer]
    WorkspaceMembership:
      type: object
      required: [workspace_id, organization_id, user_id, username, name, role, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: ana.silva
        name:
          type: string
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor, viewer]
        created_at:
          type: string
          format: date-time
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: gabriel
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    User:
      type: object
      required: [id, username, name, is_administrator, must_change_password]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          example: gabriel
        name:
          type: string
          example: Gabriel Souza
        is_administrator:
          type: boolean
          description: Whether the User is the Instance Administrator.
        must_change_password:
          type: boolean
          description: Whether a Temporary Password is pending.
    Page:
      type: object
      description: Pagination fields of every collection response; `items` holds the records.
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Returned by every error response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier of the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: Request path where the problem occurred.
        errors:
          type: array
          description: Field-level details of a validation-error problem.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Request field the error refers to.
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
  responses:
    PasswordChangeRequired:
      description: The signed-in User must change a pending Temporary Password first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/password-change-required
            title: Password change required
            status: 403
    InvalidPage:
      description: "`page` or `page_size` is out of range."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/validation-error
            title: Validation failed
            status: 422
            errors:
              - field: page_size
                code: invalid
                message: page_size must be a whole number from 1 to 100
    Unauthenticated:
      description: No valid session. Sign in again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://openboard.dev/problems/unauthenticated
            title: Not signed in
            status: 401
            instance: /api/v1/users/me
    MalformedRequest:
      description: The request body is not valid JSON for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not sent as application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginRequest:
      description: A cross-origin browser request tried to change state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The path exists but does not accept this method. See the Allow header.
      headers:
        Allow:
          schema:
            type: string
          example: GET, HEAD
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

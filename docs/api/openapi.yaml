components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeArchived:
      name: include_archived
      in: query
      description: Include Archived records when `true`.
      schema:
        type: boolean
        default: false
    PendingDeletion:
      name: pending_deletion
      in: query
      description: List Pending Deletion records instead of active ones when `true`.
      schema:
        type: boolean
        default: false
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusId:
      name: status_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkItemTypeId:
      name: type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkItemId:
      name: work_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EraId:
      name: era_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ViewId:
      name: view_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-openboard_session
      description: Opaque session token set by `POST /api/v1/sessions`.
  schemas:
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank.
          example: Acme
        owner_user_id:
          type: string
          format: uuid
          description: The User who becomes the first Organization Owner. Defaults to the creator.
    Organization:
      type: object
      required: [id, name, created_at, current_user_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
        purge_after:
          type: [string, "null"]
          format: date-time
        current_user_role:
          type: string
          enum: [owner, contributor]
          description: The role the signed-in User acts with. Administrators act as `owner` (ADR 0009).
    AddOrganizationMembershipRequest:
      type: object
      required: [username, name]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          description: Normalized to lowercase. Links an existing User as is or creates a new one.
          example: ana.silva
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed display name used when creating a new User.
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor]
          default: contributor
    UpdateOrganizationMembershipRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, contributor]
    OrganizationMembership:
      type: object
      required: [organization_id, user_id, username, name, role, created_at]
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: ana.silva
        name:
          type: string
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor]
        created_at:
          type: string
          format: date-time
    AddedOrganizationMembership:
      allOf:
        - $ref: "#/components/schemas/OrganizationMembership"
        - type: object
          properties:
            temporary_password:
              type: string
              description: Present once when an unknown Username created a new User.
    CreateWorkspaceRequest:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank and must be unique in the Organization, ignoring case.
          example: Legal
        visibility:
          type: string
          enum: [open, restricted]
          default: restricted
    UpdateWorkspaceRequest:
      type: object
      description: Fields left out keep their value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank and must be unique in the Organization, ignoring case.
          example: Legal team
        visibility:
          type: string
          enum: [open, restricted]
    Workspace:
      type: object
      required: [id, organization_id, name, visibility, created_at, updated_at, current_user_role]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          example: Legal
        visibility:
          type: string
          enum: [open, restricted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
        purge_after:
          type: [string, "null"]
          format: date-time
        current_user_role:
          type: string
          enum: [owner, contributor, viewer]
          description: |
            The Workspace role the signed-in User acts with. Administrators and
            Organization Owners act as `owner`; without a Workspace Membership,
            an Open Workspace gives `contributor`.
    AddWorkspaceMembershipRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          description: Normalized to lowercase. Must belong to the Workspace's Organization.
          example: ana.silva
        role:
          type: string
          enum: [owner, contributor, viewer]
          default: contributor
    UpdateWorkspaceMembershipRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, contributor, viewer]
    WorkspaceMembership:
      type: object
      required: [workspace_id, organization_id, user_id, username, name, role, created_at]
      properties:
        workspace_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: ana.silva
        name:
          type: string
          example: Ana Silva
        role:
          type: string
          enum: [owner, contributor, viewer]
        created_at:
          type: string
          format: date-time
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: gabriel
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    User:
      type: object
      required: [id, username, name, is_administrator, must_change_password, deactivated_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          example: gabriel
        name:
          type: string
          example: Gabriel Souza
        is_administrator:
          type: boolean
          description: Whether the User is the Instance Administrator.
        must_change_password:
          type: boolean
          description: Whether a Temporary Password is pending.
        deactivated_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    IssuedTemporaryPassword:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [temporary_password]
          properties:
            temporary_password:
              type: string
              description: Generated Temporary Password shown once.
    CreateProjectRequest:
      type: object
      required: [workspace_id, name]
      properties:
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    MoveProjectRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          format: uuid
    Project:
      type: object
      required: [id, organization_id, workspace_id, name, created_at, updated_at, archived_at, workspace_archived, is_read_only, current_user_role]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        workspace_archived:
          type: boolean
        is_read_only:
          type: boolean
        deleted_at:
          type: [string, "null"]
          format: date-time
        purge_after:
          type: [string, "null"]
          format: date-time
